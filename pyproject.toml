[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dengue-st-diagnostics"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12",
  "esda>=2.6",
  "geopandas>=1.0",
  "libpysal>=4.12",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "pdfplumber>=0.11",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pypdf>=5.1",
  "pywavelets>=1.7",
  "requests>=2.32",
  "ruptures>=1.1.9",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "shapely>=2.0",
  "statsmodels>=0.14",
  "xlrd>=2.0",
]

[project.optional-dependencies]
mining = ["rdata>=1.0"]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
dengue-st-diagnostics = "dengue_st_diagnostics.cli:main"
dengue-predictability = "dengue_st_diagnostics.predictability.runner:main"
dengue-univariate-frontier = "dengue_st_diagnostics.frontier.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dengue_st_diagnostics"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
